name: Audit

# Pull requests only. This runs on a runner that exists only while the owner
# starts one, so a branch push run as well would be a second job per bump,
# sitting queued forever and taken first by the next runner.
on:
  pull_request:

# Least privilege: this workflow only ever reads.
permissions:
  contents: read

concurrency:
  group: audit-${{ github.ref }}
  cancel-in-progress: true

jobs:
  audit:
    name: Audit
    # The owner's Mac, through `bin/local-runner.sh --repository
    # xrhstosmour/homebrew-stege` in the `stege` repository. GitHub's hosted
    # macOS pools left jobs unassigned until they were cancelled, annotated "Due
    # to capacity constraints" (measured 2026-11-04).
    #
    # A personal machine, so the job uses the Homebrew already installed rather
    # than `setup-homebrew`, never updates it, and leaves nothing behind: the
    # temporary tap is removed and its trust lands in the job's own directory.
    runs-on: stege-local
    timeout-minutes: 15
    env:
      HOMEBREW_NO_AUTO_UPDATE: "1"
      HOMEBREW_NO_INSTALL_CLEANUP: "1"
      HOMEBREW_NO_ANALYTICS: "1"

    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      # Catches what a hand-edited cask gets wrong. Both of these found real
      # problems the first time they were run against this file: a
      # `depends_on macos` value Homebrew does not accept, and an unsorted
      # `zap trash` list.
      - name: Style
        run: brew style Casks/stege.rb

      - name: Audit
        # `brew trust` writes `homebrew/trust.json` under `XDG_CONFIG_HOME`,
        # which would otherwise be the user's own configuration.
        env:
          XDG_CONFIG_HOME: ${{ runner.temp }}/xdg
        run: |
          # A run that failed before its cleanup leaves the tap behind.
          brew untap local/audit 2>/dev/null || true
          brew tap-new local/audit --no-git
          # `tap-new` makes a Formula directory and no Casks one.
          mkdir -p "$(brew --repository local/audit)/Casks"
          cp Casks/stege.rb "$(brew --repository local/audit)/Casks/stege.rb"
          # Newer Homebrew refuses to load a cask from a tap it has not been
          # told to trust, and this one is created a line above, so trusting
          # it is safe: it holds nothing but the file copied in here.
          brew trust local/audit
          brew audit --cask --strict local/audit/stege

      # The checksum in the cask has to be the checksum of the archive the URL
      # actually serves. It was taken from a 404 page once, because the release
      # workflow had not finished publishing when the bump was written, and
      # `brew install` then failed for everyone until a second pull request
      # fixed it. Nothing but this would have noticed.
      - name: The checksum matches the published archive
        run: |
          set -euo pipefail
          version="$(grep -oE 'version "[^"]+"' Casks/stege.rb | head -1 | cut -d'"' -f2)"
          declared="$(grep -oE 'sha256 "[^"]+"' Casks/stege.rb | head -1 | cut -d'"' -f2)"
          url="https://github.com/xrhstosmour/stege/releases/download/v${version}/Stege.zip"
          echo "version ${version}"
          echo "url     ${url}"
          curl --fail --location --silent --show-error --output Stege.zip "$url"
          actual="$(shasum -a 256 Stege.zip | cut -d' ' -f1)"
          echo "declared ${declared}"
          echo "actual   ${actual}"
          test "$declared" = "$actual"

      # Ties the archive back to the commit and workflow that built it, which
      # is what stands in for notarisation. A release published by anything
      # else fails here.
      - name: The archive came from the release workflow
        run: gh attestation verify Stege.zip --repo xrhstosmour/stege
        env:
          GH_TOKEN: ${{ github.token }}

      - name: Remove the temporary tap
        if: always()
        run: brew untap local/audit 2>/dev/null || true
